    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #FDFBF7; color: #5C4B41; }

        .btn-primary { background-color: #C16E59; color: white; }
        
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .safe-padding-bottom { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

            { id: 'c4', name: '剉冰撞奶茶套餐', items: [

                { id: 'i9', name: '剉冰撞奶茶套餐 B', price: 60, defaultToppings: ['薯圓','芋圓','珍珠','嫩仙草','奶酪'] },
                { id: 'i10', name: '剉冰撞奶茶套餐 C', price: 60, defaultToppings: ['紅豆','芋泥','杏仁凍','珍珠','奶酪'] }
            ]},
            { id: 'c5', name: '其他剉冰', items: [

                { id: 'i17', name: '豆花 B.薯圓,紅豆', price: 40, defaultToppings: ['薯圓','紅豆'] },

                { id: 'i19', name: '純豆花', price: 30, defaultToppings: [] }
            ]},
            { id: 'c7', name: '嫩仙草套餐', items: [
                { id: 'i20', name: '嫩仙草 A.芋圓,薯圓', price: 45, defaultToppings: ['芋圓','薯圓'] },
                { id: 'i21', name: '嫩仙草 B.芋圓,珍珠', price: 45, defaultToppings: ['芋圓','珍珠'] },
                { id: 'i22', name: '嫩仙草 C.薯圓,珍珠', price: 45, defaultToppings: ['薯圓','珍珠'] },
                { id: 'i23', name: '純嫩仙草', price: 35, defaultToppings: [] }
            ]},
            { id: 'c8', name: '熱壓土司', items: [
                { id: 'i24', name: '雙圓起司', price: 60, defaultToppings: [] },

                { id: 'i28', name: '鮪魚玉米起司', price: 60, defaultToppings: [] }
            ]},
            { id: 'c9', name: '飲料', items: [
                { id: 'i29', name: '奶茶', price: 40, defaultToppings: [] },
                { id: 'i30', name: '鮮奶茶', price: 60, defaultToppings: [] },
                { id: 'i31', name: '珍珠奶茶', price: 50, defaultToppings: [] },
                { id: 'i32', name: '珍珠鮮奶茶', price: 60, defaultToppings: [] },
                { id: 'i33', name: '嫩仙草奶茶', price: 50, defaultToppings: [] },
                { id: 'i34', name: '嫩仙草鮮奶茶', price: 60, defaultToppings: [] },
                { id: 'i35', name: '奶蓋綠茶', price: 45, defaultToppings: [] },
                { id: 'i36', name: '綠茶', price: 30, defaultToppings: [] },
                { id: 'i37', name: '手炒黑糖愛玉冰', price: 60, defaultToppings: [] }
            ]},
            { id: 'c10', name: '冬季限定 - 熱紅豆湯', items: [
                { id: 'i38', name: '綜合紅豆湯', price: 50, defaultToppings: ['芋圓','薯圓','珍珠','黑糖粉粿'] },
                { id: 'i39', name: '雙圓紅豆湯', price: 40, defaultToppings: ['芋圓','薯圓'] },
                { id: 'i40', name: '原味紅豆湯', price: 30, defaultToppings: [] }
            ]},
            { id: 'c11', name: '冬季限定 - 燒仙草套餐', items: [
                { id: 'i41', name: '燒仙草 A.芋圓,紅豆,黑粉', price: 45, defaultToppings: ['芋圓','紅豆','黑糖粉粿'] },
                { id: 'i42', name: '燒仙草 B.珍珠,紅豆,黑粉', price: 45, defaultToppings: ['珍珠','紅豆','黑糖粉粿'] },
                { id: 'i43', name: '燒仙草 C.綠豆,紅豆,薯圓', price: 45, defaultToppings: ['綠豆','紅豆','薯圓'] },
                { id: 'i44', name: '純燒仙草', price: 30, defaultToppings: [] }
            ]}
        ];

        const PREMIUM_TOPPINGS = ['芋泥', '奶酪'];
        const REGULAR_TOPPINGS = ['紅豆', '綠豆', '芋圓', '薯圓', '珍珠', '愛玉', '嫩仙草', '綠茶凍', '杏仁凍', '黑糖粉粿', '荔枝寒天', '可可寒天', '硬花生'];
        
        const CUSTOM_BASES = [
            { id: 'b1', name: '剉冰', minItems: 5, basePrice: 50 },
            { id: 'b2', name: '嫩仙草', minItems: 3, basePrice: 45 },
            { id: 'b3', name: '豆花', minItems: 3, basePrice: 40 }
        ];

        const FLAVOR_OPTIONS = [
            { label: '黑糖水', price: 0 },
            { label: '加奶蓋', price: 5 },
            { label: '加煉乳', price: 5 },
            { label: '奶蓋+煉乳', price: 10 }
        ];

        const App = () => {
            const [cloudStatus, setCloudStatus] = useState('connecting');
            const [activeTab, setActiveTab] = useState('menu'); 
            const [activeCategory, setActiveCategory] = useState('c1');
            
            const [menuData, setMenuData] = useState(DEFAULT_MENU);
            const [orders, setOrders] = useState([]);
            const [inventoryLimits, setInventoryLimits] = useState({});
            
            const [cart, setCart] = useState([]);
            const [orderType, setOrderType] = useState('內用');
            const [pagerNum, setPagerNum] = useState('');
            
            const [customBaseModal, setCustomBaseModal] = useState(null);
            const [customSelections, setCustomSelections] = useState([]);
            const [customFlavor, setCustomFlavor] = useState(FLAVOR_OPTIONS[0]);

            const [swapModal, setSwapModal] = useState(null);
            const [swapSelections, setSwapSelections] = useState([]);

            const [toast, setToast] = useState(null);
            const [warningToast, setWarningToast] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);

            useEffect(() => {
                const handleOnline = () => setCloudStatus('connected');
                const handleOffline = () => setCloudStatus('offline');
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                
                // 即時監聽訂單
                const unsubOrders = storeRef.collection("orders")
                    .orderBy("createdAt", "asc")
                    .onSnapshot(snapshot => {
                        setCloudStatus('connected');
                        const fetched = [];
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            const timestamp = data.createdAt ? data.createdAt.toDate().getTime() : Date.now();
                            fetched.push({ id: doc.id, ...data, timestamp });
                        });
                        setOrders(fetched);
                    }, err => {
                        console.error("雲端讀取遭拒:", err);
                        setCloudStatus('offline');
                    });
                
                // 即時監聽設定檔
                const unsubConfig = storeRef.collection("config").doc("settings")
                    .onSnapshot(docSnap => {
                        if (docSnap.exists) {
                            const data = docSnap.data();
                            if (data.menu) setMenuData(data.menu);
                            if (data.limits) setInventoryLimits(data.limits);
                        } else {
                            storeRef.collection("config").doc("settings").set({ menu: DEFAULT_MENU, limits: {} }).catch(()=>{});
                        }
                    }, err => console.error("設定檔同步失敗", err));

                return () => { 
                    unsubOrders(); 
                    unsubConfig();
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); });

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 1500);
            };

            const showWarning = (msg) => {
                setWarningToast(msg);
                setTimeout(() => setWarningToast(null), 4000);
            };

            const getTodayUsage = () => {
                const today = new Date().toDateString();
                const clearTime = inventoryLimits._clearedAt || 0; 
                
                const todayOrders = orders.filter(o => 
                    new Date(o.timestamp).toDateString() === today && 
                    o.status !== 'deleted' && 
                    o.timestamp >= clearTime 
                );
                const usage = {};
                todayOrders.forEach(order => {
                    order.items.forEach(item => {
                        (item.toppings || []).forEach(t => { usage[t] = (usage[t] || 0) + 1; });
                    });
                });
                return usage;
            };

            const checkInventoryWarning = () => {
                const usage = getTodayUsage();
                const warnings = [];
                Object.keys(inventoryLimits).forEach(topping => {
                    const limit = parseInt(inventoryLimits[topping]);
                    if (!isNaN(limit) && limit > 0) {
                        const remain = limit - (usage[topping] || 0);
                        if (remain <= 5 && remain >= 0) { warnings.push(`${topping} 僅剩 ${remain} 份`); }
                    }
                });
                if (warnings.length > 0) showWarning(`⚠️ 備料提醒：\n${warnings.join('\n')}`);
            };

            // 修正：強制將 basePrice 轉為數字，避免字串相加變成 5500
            const calculatePrice = (basePrice, minItems, selections) => {
                const base = Number(basePrice) || 0;
                let extraCount = Math.max(0, selections.length - minItems);
                let premiumCount = selections.filter(t => t === '芋泥' || t === '奶酪').length;
                let chargePremium = Math.min(extraCount, premiumCount);
                let chargeNormal = Math.max(0, extraCount - chargePremium);
                return base + (chargePremium * 10) + (chargeNormal * 5);
            };

            const handleAddCustomToCart = () => {
                if (customSelections.length < customBaseModal.minItems) {
                    return alert(`最少需選 ${customBaseModal.minItems} 樣配料！`);
                }
                setCart([...cart, {
                    id: Date.now().toString(),
                    name: `自選${customBaseModal.name} (${customFlavor.label})`,
                    price: calculatePrice(customBaseModal.basePrice, customBaseModal.minItems, customSelections) + (Number(customFlavor.price) || 0),
                    toppings: customSelections,
                    flavor: customFlavor.label
                }]);
                setCustomBaseModal(null);
                setCustomSelections([]);
                setCustomFlavor(FLAVOR_OPTIONS[0]);
                showToast("已加入待送單");
            };

            const handleAddSwapToCart = () => {
                setCart([...cart, {
                    id: Date.now().toString(),
                    name: swapModal.name,
                    price: calculatePrice(swapModal.price, (swapModal.defaultToppings || []).length, swapSelections),
                    toppings: swapSelections
                }]);
                setSwapModal(null);
                setSwapSelections([]);
                showToast("已加入待送單");
            };

            const submitOrder = async () => {
                if (cart.length === 0) return alert("尚未加入任何餐點！");
                if (!pagerNum.trim()) return alert("請輸入號碼機號碼！");

                const currentPagerNum = pagerNum.trim();
                const orderData = {
                    pagerNum: currentPagerNum,
                    orderType, 
                    items: cart, 
                    total: cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0),
                    status: 'pending', 
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                setCart([]);
                setPagerNum('');
                
                if (window.innerWidth < 1024) {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
                showToast(`✅ 訂單送出！號碼機：${currentPagerNum}`);

                try {
                    await storeRef.collection("orders").add(orderData);
                    setTimeout(checkInventoryWarning, 500);
                } catch (err) {
                    console.error("送出失敗", err);
                    showToast("送出失敗，請確認 Firebase 規則已設定", "error");
                }
            };

            const updateOrderStatus = async (orderId, newStatus) => {
                try {
                    await storeRef.collection("orders").doc(orderId).set({ status: newStatus }, { merge: true });
                } catch (err) {
                    console.error("狀態同步失敗", err);
                }
            };

            const handleDeleteOrder = (order) => {
                setConfirmDialog({
                    title: '確認刪除',
                    message: `確定要刪除號碼機 ${order.pagerNum} 嗎？今日統計將同步扣除。`,
                    onConfirm: () => {
                        setConfirmDialog(null);
                        updateOrderStatus(order.id, 'deleted').then(() => {
                            showToast("已刪除並扣除統計", "error");
                        });
                    }
                });
            };

            // 新增：歷史紀錄一鍵清除所有待製作訂單
            const handleClearAllPending = () => {
                const pendingOrders = orders.filter(o => o.status === 'pending');
                if (pendingOrders.length === 0) return;
                setConfirmDialog({
                    title: '一鍵清除待製作訂單',
                    message: `確定要將目前 ${pendingOrders.length} 筆待製作訂單全部清除嗎？\n（會標記為完成，不會扣除今日數量統計）`,
                    onConfirm: () => {
                        setConfirmDialog(null);
                        const batch = db.batch();
                        pendingOrders.forEach(o => {
                            batch.set(storeRef.collection("orders").doc(o.id), { status: 'completed' }, { merge: true });
                        });
                        batch.commit()
                            .then(() => showToast("已一鍵清除所有待製作訂單"))
                            .catch(err => console.error("一鍵清除失敗", err));
                    }
                });
            };

            const handleClearStats = () => {
                setConfirmDialog({
                    title: '清除今日統計',
                    message: '確定要將今日的數量統計歸零嗎？\n這不會刪除歷史訂單，只會重新計算今日備料數量。',
                    onConfirm: () => {
                        setConfirmDialog(null);
                        saveSettings('limits', { ...inventoryLimits, _clearedAt: Date.now() }).then(() => {
                            showToast("統計已歸零");
                        });
                    }
                });
            };

            const saveSettings = async (type, data) => {
                if (type === 'menu') setMenuData(data);
                if (type === 'limits') setInventoryLimits(data);
                
                try {
                    await storeRef.collection("config").doc("settings").set({ [type]: data }, { merge: true });
                } catch (err) {
                    console.error("設定存檔失敗", err);
                }
            };

            const scrollToCategory = (id) => {
                setActiveCategory(id);
                const el = document.getElementById(`cat-${id}`);
                if (el) {
                    const headerOffset = window.innerWidth >= 1024 ? 100 : 210;
                    const offsetPosition = el.getBoundingClientRect().top + window.pageYOffset - headerOffset;
                    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                }
            };

            const scrollToCheckout = () => {
                const el = document.getElementById('order-details');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'end' });
            };

            const currentUsage = getTodayUsage();
            const uncompletedCount = orders.filter(o => o.status === 'pending').length;
            const cartTotal = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);

            return (
                <div className="min-h-screen flex flex-col bg-[#FDFBF7] relative">
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300">
                            <div className={`px-6 py-3 rounded-full text-white font-bold shadow-lg flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-500' : 'bg-[#5C4B41]'}`}>
                                {toast.msg}
                            </div>
                        </div>
                    )}
                    {warningToast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 w-[90%] max-w-sm">
                            <div className="px-6 py-4 rounded-xl bg-yellow-100 text-yellow-800 border-2 border-yellow-400 font-bold shadow-lg text-center">
                                {warningToast}
                            </div>
                        </div>
                    )}
                    
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center">
                                <h3 className="text-xl font-black text-[#5C4B41] mb-2">{confirmDialog.title}</h3>
                                <p className="text-gray-600 font-bold mb-6 whitespace-pre-line">{confirmDialog.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 py-3 rounded-xl font-bold bg-gray-100 text-gray-600">取消</button>
                                    <button onClick={confirmDialog.onConfirm} className="flex-1 py-3 rounded-xl font-bold bg-red-500 text-white">確定執行</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header：手機直式維持原樣，平板橫式 (lg:) 自動變成單排導覽列 */}
                    <header className="sticky top-0 bg-[#FDFBF7] z-40 px-4 pt-4 pb-3 lg:py-3 shadow-[0_4px_10px_-4px_rgba(0,0,0,0.05)] border-b border-[#E6D5C9]">
                        <div className="max-w-2xl lg:max-w-7xl mx-auto lg:flex lg:justify-between lg:items-center lg:gap-6">
                            <div className="flex justify-between items-center mb-5 lg:mb-0">
                                <div className="flex items-center gap-2.5">
                                    <div className="w-[42px] h-[42px] rounded-full theme-bg text-white flex items-center justify-center font-black text-xl shadow-sm">冰</div>
                                    <div>
                                        <h1 className="text-xl font-black text-[#5C4B41] tracking-wide leading-tight flex items-center">
                                            冰圓屋

                                            <div className="grid grid-cols-2 gap-2">
                                                {FLAVOR_OPTIONS.map(f => (
                                                    <button key={f.label} onClick={() => setCustomFlavor(f)} className={`py-2 rounded-xl font-bold border-2 transition-colors ${customFlavor.label === f.label ? 'bg-[#fbebe3] border-[#C16E59] text-[#C16E59]' : 'bg-[#fdf8f5] border-transparent text-[#A68A7A]'}`}>
                                                        {f.label} {f.price > 0 ? `(+$${f.price})` : ''}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* 8個選料格 */}
                                    <div className="grid grid-cols-4 gap-3 mb-8">
                                        {Array.from({length: 8}).map((_, i) => {
                                            const activeSelections = customBaseModal ? customSelections : swapSelections;
                                            const sel = activeSelections[i];
                                            const isBasic = customBaseModal && i < customBaseModal.minItems;
                                            return (
                                                <div key={i} onClick={() => {
                                                    if(sel) {
                                                        const newArr = [...activeSelections];
                                                        newArr.splice(i, 1);
                                                        customBaseModal ? setCustomSelections(newArr) : setSwapSelections(newArr);
                                                    }
                                                }} className={`relative flex flex-col items-center justify-center h-[4.5rem] rounded-2xl border-2 transition-all ${sel ? 'border-[#5C4B41] bg-white shadow-sm cursor-pointer' : 'border-dashed border-[#d8c8bd]'}`}>
                                                    {sel ? (
                                                        <>
                                                            <span className="text-[15px] font-black text-[#5C4B41] whitespace-nowrap tracking-tighter px-1">{sel}</span>
                                                            <button className="absolute -top-2 -right-2 w-5 h-5 bg-[#C16E59] text-white rounded-full flex items-center justify-center shadow"><i data-lucide="x" className="w-3 h-3"></i></button>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <span className="text-xs font-bold text-[#A68A7A]">欄位 {i+1}</span>
                                                            {isBasic && <span className="text-[10px] text-[#A68A7A] font-bold">基本</span>}
                                                        </>
                                                    )}
                                                </div>
                                            )
                                        })}
                                    </div>

                                    {/* 加價與一般配料 */}
                                    <h4 className="font-bold text-[#A68A7A] mb-3 text-sm">加價配料 (每樣 +$10)</h4>
                                    <div className="flex flex-wrap gap-2 mb-6 bg-white p-3 rounded-2xl shadow-sm border border-[#E6D5C9]">
                                        {PREMIUM_TOPPINGS.map(t => {
                                            const activeSelections = customBaseModal ? customSelections : swapSelections;
                                            const count = activeSelections.filter(x => x === t).length;
                                            return (
                                                <button key={t} onClick={() => {
                                                    if(activeSelections.length < 8) {
                                                        customBaseModal ? setCustomSelections([...customSelections, t]) : setSwapSelections([...swapSelections, t]);
                                                    }
                                                }} className="relative bg-[#fbebe3] border border-[#E6D5C9] px-4 py-2.5 rounded-full font-bold text-[#5C4B41] active:bg-[#f2d8c9]">
                                                    {t} <span className="text-[#C16E59] text-xs">+$10</span>
                                                    {count > 0 && <span className="absolute -top-1 -right-1 bg-[#C16E59] text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">{count}</span>}
                                                </button>
                                            )
                                        })}
                                    </div>

                                    <h4 className="font-bold text-[#A68A7A] mb-3 text-sm">一般配料 {customBaseModal ? `(基本 ${customBaseModal.minItems} 樣內免費，超出每樣 +$5)` : '(差額每樣 +$5)'}</h4>
                                    <div className="flex flex-wrap gap-2 bg-white p-3 rounded-2xl shadow-sm border border-[#E6D5C9]">
                                        {REGULAR_TOPPINGS.map(t => {
                                            const activeSelections = customBaseModal ? customSelections : swapSelections;
                                            const count = activeSelections.filter(x => x === t).length;
                                            return (
                                                <button key={t} onClick={() => {
                                                    if(activeSelections.length < 8) {
                                                        customBaseModal ? setCustomSelections([...customSelections, t]) : setSwapSelections([...swapSelections, t]);
                                                    }
                                                }} className="relative bg-[#fdf8f5] border border-[#E6D5C9] px-4 py-2.5 rounded-full font-bold text-[#5C4B41] active:bg-[#f2e9e4]">
                                                    {t}
                                                    {count > 0 && <span className="absolute -top-1 -right-1 bg-[#5C4B41] text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">{count}</span>}
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* 配料視窗底部送單列 */}
                            <div className="fixed bottom-0 left-0 right-0 bg-[#5C4B41] pt-4 safe-padding-bottom px-4 flex justify-between items-center z-50 max-w-2xl mx-auto rounded-t-3xl shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)]">
                                <button onClick={() => {setCustomBaseModal(null); setSwapModal(null);}} className="absolute -top-12 right-4 w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center text-gray-600"><i data-lucide="x"></i></button>
                                <div className="text-white">
                                    <div className="text-xs text-gray-300">目前累計</div>
                                    <div className="text-2xl font-black flex items-center gap-2">
                                        <span className="bg-[#C16E59] text-sm px-2 py-0.5 rounded-md">{(customBaseModal ? customSelections : swapSelections).length} 項</span>
                                        ${customBaseModal ? calculatePrice(customBaseModal.basePrice, customBaseModal.minItems, customSelections) + (Number(customFlavor.price) || 0) : calculatePrice(swapModal.price, (swapModal.defaultToppings || []).length, swapSelections)}
                                    </div>
                                </div>
                                <button onClick={customBaseModal ? handleAddCustomToCart : handleAddSwapToCart} className="bg-[#FDFBF7] text-[#5C4B41] px-6 py-3 rounded-2xl font-black text-lg active:scale-95">
                                    確認加入
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 主畫面浮動結帳列 (僅在手機直式顯示，平板橫式自動隱藏) */}
                    {activeTab === 'menu' && (
                        <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-[#5C4B41] pt-4 safe-padding-bottom px-4 flex justify-between items-center z-30 max-w-2xl mx-auto rounded-t-3xl shadow-[0_-10px_20px_-5px_rgba(0,0,0,0.15)]">
                            <div className="text-white flex items-center gap-3">
                                <div className="bg-[#A68A7A] w-12 h-12 flex flex-col justify-center items-center rounded-xl font-bold">
                                    <span className="text-[10px] text-gray-200">項數</span>
                                    <span className="text-xl leading-none">{cart.length}</span>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-300">目前累計金額</div>
                                    <div className="text-2xl font-black">${cartTotal}</div>
                                </div>
                            </div>
                            <button onClick={scrollToCheckout} className="bg-[#FDFBF7] text-[#5C4B41] px-6 py-3 rounded-2xl font-black text-lg flex items-center gap-2 active:scale-95">
                                前往結帳 <i data-lucide="arrow-down" className="w-5 h-5"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
